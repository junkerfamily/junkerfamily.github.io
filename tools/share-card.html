<!doctype html>
<!-- Source for og.png (the link-preview image). Rebuild with: ./tools/share-card.sh -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 700px at 85% 110%, #3a2216 0%, transparent 60%), #15120f;
    color: #f3eee7; font-family: Inter, sans-serif; display: flex; align-items: center; gap: 72px; padding: 0 96px; box-sizing: border-box;
  }
  .logo { flex: none; display: grid; grid-template-columns: repeat(2, 130px); gap: 22px; }
  .logo i { width: 130px; height: 130px; border-radius: 30px; background: #ff7a45; display: block; }
  .logo i:nth-child(2), .logo i:nth-child(3) { opacity: .7; }
  .logo i:nth-child(4) { opacity: .4; }
  h1 { font-family: Fraunces, serif; font-weight: 700; font-size: 104px; line-height: .98; letter-spacing: -.02em; margin: 0 0 22px; }
  h1 span { color: #ff7a45; }
  p { margin: 0; font-size: 34px; color: #b7aea3; }
</style></head>
<body>
  <div class="logo"><i></i><i></i><i></i><i></i></div>
  <div>
    <h1>Dan <span>Junker</span></h1>
    <p>Portfolio · games, tools &amp; apps</p>
  </div>
</body></html>
